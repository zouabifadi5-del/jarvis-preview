name = "jarvis-preview-api"
main = "src/worker.js"
compatibility_date = "2026-11-14"

# Static owner-access shell is served from the same hostname as the API.
[assets]
directory = "./public"
binding = "ASSETS"

# Preview worker binding. D1 databases are account-scoped, not branch-scoped;
# verify the target environment before any deployment.
[[d1_databases]]
binding = "DB"
database_name = "jarvis-owner-auth"
database_id = "2bee8195-488a-4c73-ba42-d21950e890c4"

# No account ID, routes, or paid resources are configured here.

# Workers AI is only invoked from the authenticated, stateless chat route.
[ai]
binding = "AI"
