name: Bootstrap reproducible runtime lockfile

on:
  push:
    branches:
      - jarvis-security-hardening
    paths:
      - package.json
      - .github/workflows/lockfile-bootstrap.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: jarvis-security-hardening
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Resolve the pinned runtime dependency without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit the generated lockfile if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
          else
            git commit -m "build: commit reproducible runtime dependency lockfile"
            git push origin HEAD:jarvis-security-hardening
          fi
