name: Worker runtime tests

on:
  push:
    branches:
      - jarvis-worker-runtime-tests
  pull_request:
    branches:
      - jarvis-foundation
      - main

permissions:
  contents: read

jobs:
  worker-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Report Node.js and npm versions
        run: node --version && npm --version
      - name: Validate D1 auth schema and storage helpers with local SQLite (no Cloudflare account)
        run: node --experimental-sqlite --test tests/auth-schema.test.js tests/d1-store.test.js tests/worker.test.mjs
      - name: Install temporary test tooling and WebAuthn candidate
        run: npm install --no-save --no-audit --no-fund vitest@4.1.0 @cloudflare/vitest-plugin@1.8.2 @simplewebauthn/server@14.1.0
      - name: Audit runtime dependency tree (moderate and above)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Check browser client JavaScript syntax
        run: node --check public/app.js
      - name: Validate Wrangler and static asset configuration without deploying
        run: npx --yes wrangler@4.148.0 deploy --dry-run
      - name: Run tests inside the Cloudflare Workers runtime
        run: npx vitest run --config vitest.config.js
